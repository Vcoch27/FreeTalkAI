name: FreeTalk
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FreeTalk:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Generated/backend-url.txt
        buildPhase: resources
      - path: Generated/Client
        type: folder
        buildPhase: resources
      - path: Generated/lets_talk.wav
        buildPhase: resources
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: FreeTalk
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [freetalk-jp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.freetalk.japanese.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FreeTalkWidget
        embed: true
  FreeTalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Generated/backend-url.txt
        buildPhase: resources
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: FreeTalk
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.freetalk.japanese.ios.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  FreeTalk:
    build:
      targets:
        FreeTalk: all
    run:
      config: Debug
    archive:
      config: Release
